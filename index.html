<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marcos & Mery">
  <meta name="theme-color" content="#1a3a5c">
  <title>Viajes · Marcos & Mery</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/styles.css?v=114">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <link rel="icon" type="image/png" href="img/icon-192.png">

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registrado:', r.scope))
          .catch(e => console.warn('SW error:', e));
      });
    }
  </script>
</head>
<body>
  <div id="app">

    <!-- HEADER -->
    <header class="app-header">
      <button class="back-btn" id="header-back" aria-label="Volver">‹</button>
      <h1 id="header-title">Mis Viajes</h1>
      <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Cambiar tema"></button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="view-content" id="view-content">
      <!-- Rendered by JS -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none">
      <!-- Iconos de línea propios (iguales en todos los móviles, en vez de emojis) -->
      <button class="nav-item" data-view="trip">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h4.5v-6h4v6h4.5V9"/></svg></span>
        <span>Inicio</span>
      </button>
      <button class="nav-item" data-view="today">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span>
        <span>Hoy</span>
      </button>
      <button class="nav-item" data-view="itinerary">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></span>
        <span>Días</span>
      </button>
      <button class="nav-item" data-view="map">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3.5 6v14L9 18l6 2 5.5-2V4L15 6z"/><path d="M9 4v14M15 6v14"/></svg></span>
        <span>Mapa</span>
      </button>
      <button class="nav-item" data-view="docs">
        <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></span>
        <span>Docs</span>
      </button>
    </nav>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App Scripts -->
  <script src="js/data.js?v=92"></script>
  <script src="js/guia.js?v=5"></script>
  <script src="js/app.js?v=196"></script>
</body>
</html>
