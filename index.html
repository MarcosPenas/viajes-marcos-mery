<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Marcos & Mery">
  <meta name="theme-color" content="#1a3a5c">
  <title>Viajes · Marcos & Mery</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/styles.css?v=79">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <!-- Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(r => console.log('SW registrado:', r.scope))
          .catch(e => console.warn('SW error:', e));
      });
    }
  </script>
</head>
<body>
  <div id="app">

    <!-- HEADER -->
    <header class="app-header">
      <button class="back-btn" id="header-back" aria-label="Volver">‹</button>
      <h1 id="header-title">Mis Viajes</h1>
      <button class="theme-toggle-btn" id="theme-toggle-btn" aria-label="Cambiar tema"></button>
    </header>

    <!-- MAIN CONTENT -->
    <main class="view-content" id="view-content">
      <!-- Rendered by JS -->
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav" id="bottom-nav" style="display:none">
      <button class="nav-item" data-view="trip">
        <span class="nav-icon">🏠</span>
        <span>Inicio</span>
      </button>
      <button class="nav-item" data-view="today">
        <span class="nav-icon">☀️</span>
        <span>Hoy</span>
      </button>
      <button class="nav-item" data-view="itinerary">
        <span class="nav-icon">📅</span>
        <span>Días</span>
      </button>
      <button class="nav-item" data-view="map">
        <span class="nav-icon">🗺️</span>
        <span>Mapa</span>
      </button>
      <button class="nav-item" data-view="docs">
        <span class="nav-icon">📁</span>
        <span>Docs</span>
      </button>
    </nav>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- App Scripts -->
  <script src="js/data.js?v=65"></script>
  <script src="js/app.js?v=145"></script>
</body>
</html>
